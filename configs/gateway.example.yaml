# S2：新客户端 Key 建议登录后通过 /api/me/keys 生成；下方 YAML token 属于旧种子导入，默认无主，必须显式认领后才能调用。
# Copy to config.yaml (ignored by Git) and edit locally.
# Relative database paths are resolved from the process working directory.
server:
  addr: "127.0.0.1:8080"
  retry_times: 2
  timeout_seconds: 120
  # 包含全部重试的总请求预算；未填写时与 timeout_seconds 相同。
  total_timeout_seconds: 120
  # 可选会话亲和。默认关闭；确认上游缓存/延迟有实际收益后再开启。
  session_affinity: false
  # IP 级限流的每分钟请求数上限，0 表示不限。
  # 自用（本机/内网访问）保持 0；暴露到公网时务必配上，比如 120。
  ip_rpm_limit: 0
  # S3：单进程转发并发上限。0/省略使用下列默认值，不表示无限。
  # 要求 key <= user < instance，确保单用户不能占满所有实例名额。
  concurrency:
    instance: 256
    user: 32
    key: 16
    channel: 64

# 管理 API（/api/*）的访问密钥，**必填**——缺失时网关拒绝启动。
# 生产部署优先用环境变量 GATEWAY_ADMIN_KEY（密钥不该写进会进 git 的文件）。
admin_key: "REPLACE_WITH_ADMIN_KEY"

# 进程日志级别：debug / info / warn / error（环境变量 GATEWAY_LOG_LEVEL 优先）。
log_level: "info"

# 请求日志（logs 表）保留天数，0 表示关闭自动清理
# （环境变量 GATEWAY_LOG_RETENTION_DAYS 优先）。
log_retention_days: 30

database:
  driver: "sqlite"
  path: ".local/data/gateway.db"
  # Opt in only after stopping the old process and making a consistent backup.
  # Once enabled, missing/wrong keys refuse startup; there is no plaintext fallback.
  # credential_keys_file: "/run/secrets/txapi-credentials.json"
  # GATEWAY_CREDENTIAL_KEYS_FILE overrides this path. Required for generation.enabled.

# legacy: 保留兼容额度计费，不保证严格预算；disabled: 不计费、不检查额度。
# strict: 用户/Key 同事务预留整笔单次收费上限，再按实际用量幂等结算。
# 缺少上限/价格/账本组件时拒绝新调用，绝不退回 legacy；未知用量保留额度待对账。
# 环境变量 GATEWAY_BILLING_MODE 优先。计价采用 1e-9 货币单位，向上取整。
billing:
  mode: "legacy"
  # 严格模式必须填写十进制字符串；预留覆盖输入、输出和倍率的合计收费。
  # 这是本系统用户收费上限，不是厂商绝对成本保证；实际费用超过上限进入待对账。
  # max_request_cost: "0.10"
  # 发送前还会按固定售价/目标倍率核算契约输入+显式输出的收费上界；
  # 无法被这笔预留覆盖则返回 billing_fee_limit，不因上游成本低而放行。
  # strict 还需独立的所有尝试累计上游成本预算及明确成本契约。
  # 此配置不是种子，重启生效；空契约拒绝执行，不能使用售价或别名替代。
  # 当前可执行费率档案仅 USD；此 provider 预算不是用户售价单位或自动换汇。
  # max_provider_request_cost: "0.10"
  # provider_contracts:
  #   - channel_id: 1
  #     base_url: "https://api.openai.com"
  #     protocol: "openai"
  #     actual_model: "text-embedding-3-small"
  #     operation: "embeddings"
  #     input_bound_profile: "openai_embeddings_v1"
  #     tariff_profile: "openai_standard_usd_2026_10_17"
  #     currency: "USD"
  #     credential_bindings:
  #       "123": "REPLACE_WITH_LOWERCASE_SHA256_OF_EXACT_UPSTREAM_KEY"
  #     input_token_ceiling: 300000
  #     input_price_per_1k: "0.00002"
  #     output_price_per_1k: "0"
  #     evidence: "REPLACE: verified whole-attempt input/output ceilings and upper tariff"
  # strict 执行必须配置已登记的 input_bound_profile；省略会在网络前拒绝，
  # 返回 provider_input_unproven，不因 evidence 非空放行。可选择
  # "openai_embeddings_v1"；仅适用于官方 base URL
  # https://api.openai.com、embeddings 操作和登记的 embedding 模型。
  # 该档案的 input_token_ceiling 至少 300000，不是单输入的 8192。
  # 输出字段/上限为空/0，输出价为 "0"；详见 docs/reference/input-bound-profiles.md。
  # Chat 使用 "openai_chat_v1"，仅官方 gpt-4o-mini-2024-07-18；
  # input_token_ceiling >= 128000，max_completion_tokens <= 16384，
  # 请求必须显式 service_tier: "default"。还须有登记费率档案、USD 币种及
  # ID -> Key 摘要绑定；标准费率下限不足拒绝启动，缺档案/换 Key 在发送前拒绝。
  # 摘要获取与适用范围见 docs/reference/provider-tariff-profiles.md。
  # 上述数值仅展示语法，不是任何真实模型保证！必须核实全批输入、
  # reasoning/cache/错误请求的总可计费范围及每个绑定凭据的最高适用价格；
  # 已登记标准费率下限不替代失败收费/附加费证明或未来价格变更核查。

# Optional durable generation runtime. This does not expose a background API.
# Secret bytes belong in a separately mounted JSON file, never in this YAML.
# The runtime requires configured strict fee/provider ceilings and contracts.
generation:
  enabled: false
  # keys_file: "/run/secrets/txapi-generation.json"
  # GATEWAY_GENERATION_KEYS_FILE overrides the path.
  workers: 2
  poll_milliseconds: 250
  lease_seconds: 10
  deadline_seconds: 120
  retention_seconds: 86400
  max_output_bytes: 262144
  instance_records: 256
  owner_records: 32
  instance_bytes: 16777216
  owner_bytes: 4194304

# Native foreground Responses, separate from the strict durable worker runtime.
# Requires activated credential encryption and a mounted content key file.
# Retained content keys and the digest key must survive restarts and restores.
responses:
  enabled: false
  # keys_file: "/run/secrets/txapi-generation.json"
  # GATEWAY_RESPONSES_KEYS_FILE overrides the path; share with generation if both enabled.
  retention_seconds: 86400
  replay_seconds: 3600
  # Encrypted persistent response/conversation snapshots, fixed TTL per object.
  history_seconds: 86400
  history_instance_bytes: 67108864
  history_owner_bytes: 16777216
  max_output_bytes: 262144
  instance_records: 1024
  owner_records: 128
  instance_bytes: 16777216
  owner_bytes: 4194304
  active_requests: 32
  owner_requests: 4

# 渠道与令牌是**种子数据**：只在数据库为空时导入一次，之后通过管理 API 增删改。
# 真实使用时替换 base_url、模型名和两个 key 占位符；
# 渠道上游 Key 也可用环境变量 GATEWAY_CHANNEL_KEY_<id> 覆盖（部署时更推荐）。
channels:
  - id: 1
    name: "primary"
    type: "openai"
    base_url: "https://api.example.com"
    key: "REPLACE_WITH_UPSTREAM_KEY"
    models:
      - "your-model"
    weight: 1

tokens:
  - key: "REPLACE_WITH_CLIENT_KEY"
    name: "local-client"
    models:
      - "your-model"
