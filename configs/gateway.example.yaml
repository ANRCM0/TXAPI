# S2：新客户端 Key 建议登录后通过 /api/me/keys 生成；下方 YAML token 属于旧种子导入，默认无主，必须显式认领后才能调用。
# Copy to config.yaml (ignored by Git) and edit locally.
# Relative database paths are resolved from the process working directory.
server:
  addr: "127.0.0.1:8080"
  retry_times: 2
  timeout_seconds: 120
  # 包含全部重试的总请求预算；未填写时与 timeout_seconds 相同。
  total_timeout_seconds: 120
  # 可选会话亲和。默认关闭；确认上游缓存/延迟有实际收益后再开启。
  session_affinity: false
  # IP 级限流的每分钟请求数上限，0 表示不限。
  # 自用（本机/内网访问）保持 0；暴露到公网时务必配上，比如 120。
  ip_rpm_limit: 0
  # S3：单进程转发并发上限。0/省略使用下列默认值，不表示无限。
  # 要求 key <= user < instance，确保单用户不能占满所有实例名额。
  concurrency:
    instance: 256
    user: 32
    key: 16
    channel: 64

# 管理 API（/api/*）的访问密钥，**必填**——缺失时网关拒绝启动。
# 生产部署优先用环境变量 GATEWAY_ADMIN_KEY（密钥不该写进会进 git 的文件）。
admin_key: "REPLACE_WITH_ADMIN_KEY"

# 进程日志级别：debug / info / warn / error（环境变量 GATEWAY_LOG_LEVEL 优先）。
log_level: "info"

# 请求日志（logs 表）保留天数，0 表示关闭自动清理
# （环境变量 GATEWAY_LOG_RETENTION_DAYS 优先）。
log_retention_days: 30

database:
  driver: "sqlite"
  path: ".local/data/gateway.db"

# 渠道与令牌是**种子数据**：只在数据库为空时导入一次，之后通过管理 API 增删改。
# 真实使用时替换 base_url、模型名和两个 key 占位符；
# 渠道上游 Key 也可用环境变量 GATEWAY_CHANNEL_KEY_<id> 覆盖（部署时更推荐）。
channels:
  - id: 1
    name: "primary"
    type: "openai"
    base_url: "https://api.example.com"
    key: "REPLACE_WITH_UPSTREAM_KEY"
    models:
      - "your-model"
    weight: 1

tokens:
  - key: "REPLACE_WITH_CLIENT_KEY"
    name: "local-client"
    models:
      - "your-model"
