function modal(title,body){const d=document.getElementById('modal');d.innerHTML='<div class="dialog-head"><h2 id="dialog-title">'+title+'</h2><button class="icon-button" data-action="close" aria-label="关闭弹窗">'+icon('close')+'</button></div><div class="dialog-body">'+body+'</div>';if(!d.open)d.showModal()}
function detail(title,rows,paragraph){modal(title,(paragraph?'<p>'+paragraph+'</p>':'')+rows.map(r=>'<div class="detail-row"><span>'+esc(r[0])+'</span><strong style="font-weight:500;text-align:right">'+esc(r[1])+'</strong></div>').join('')+'<div class="dialog-actions">'+button('关闭','close')+'</div>')}
function createKey(){modal('创建演示 API Key','<p>为应用分配一枚独立 Key。此预览仅生成无效的演示凭据，不连接后端。</p><form id="key-form"><label>Key 名称<input name="name" placeholder="例如：My production app" maxlength="40" required autocomplete="off"></label><label>可访问模型<select name="scope"><option>全部已授权模型</option><option>gpt-4o-mini</option></select></label><div class="dialog-actions">'+button('取消','close')+'<button class="button primary" type="submit">创建演示 Key</button></div></form>')}
async function copy(value){try{await navigator.clipboard.writeText(value);toast('已复制到剪贴板')}catch{modal('复制内容','<p>可在下方选择并复制。</p><input aria-label="待复制内容" readonly value="'+esc(value)+'"><div class="dialog-actions">'+button('关闭','close')+'</div>')}}
function exportData(ledger){const rows=ledger?[['记录 ID','模型','财务状态','费用'],...requests.map((r,i)=>['bill_demo_00'+(i+1),r.model,r.status,r.status==='pending'?'未知':i===4?'0':r.cost])]:[['请求 ID','模型','状态','Token','延迟'],...requests.map(r=>[r.id,r.model,r.status,r.tokens,r.latency])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=ledger?'txapi-demo-ledger.csv':'txapi-demo-requests.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示数据')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close'){document.getElementById('modal').close();return}if(a==='menu'){document.getElementById('app').classList.toggle('menu-open');return}if(a==='nav'){location.hash=b.dataset.page;return}if(a==='metric'){metric=b.dataset.value;render();return}if(a==='create-key'){createKey();return}if(a==='copy-endpoint'){copy('https://api.example.com/v1');return}if(a==='copy-secret'){copy(b.dataset.secret);return}if(a==='export'||a==='export-ledger'){exportData(a==='export-ledger');return}if(a==='refresh'){toast('演示快照已刷新，未连接真实服务');return}if(a==='toggle-channel'){const c=channels.find(c=>c.id===Number(b.dataset.id));modal(c.status==='active'?'停用演示渠道':'启用演示渠道','<p>'+esc(c.name)+' 的状态只会在当前预览中变更。</p><div class="dialog-actions">'+button('取消','close')+'<button class="button primary" data-action="confirm-channel" data-id="'+c.id+'">确认变更</button></div>');return}if(a==='confirm-channel'){const c=channels.find(c=>c.id===Number(b.dataset.id));c.status=c.status==='active'?'disabled':'active';document.getElementById('modal').close();render();toast('演示渠道状态已更新');return}if(a==='toggle-key'){const k=keys.find(k=>k.id===Number(b.dataset.id));modal(k.status==='active'?'停用演示 Key':'启用演示 Key','<p>'+esc(k.name)+' 的状态只会在当前预览中变更。</p><div class="dialog-actions">'+button('取消','close')+'<button class="button primary" data-action="confirm-key" data-id="'+k.id+'">确认变更</button></div>');return}if(a==='confirm-key'){const k=keys.find(k=>k.id===Number(b.dataset.id));k.status=k.status==='active'?'disabled':'active';document.getElementById('modal').close();render();toast('演示 Key 状态已更新');return}if(a==='request'||a==='ledger-detail'){const r=requests.find(r=>r.id===b.dataset.id);detail(a==='request'?'请求详情':'财务事实',[['请求 ID',r.id],['模型',r.model],['调用 Key',r.key],['协议',r.protocol],['原生用量',r.tokens==='未知'?'未知，保留预算':r.tokens+' Token'],['财务状态',r.status==='pending'?'pending · 双 hold 保留':'settled · 已知用量'],['发送次数','1 次（演示）']],r.status==='pending'?'演示上游未返回完整用量。页面显示未知，不将其视为免费或已完成结算。':'静态演示记录，用于查看信息层级与详情交互。');return}if(a==='quickstart'){modal('接入你的应用','<p>以下仅为示例。替换成部署后的地址、实际 Key 和已授权模型。</p><pre class="secret" style="white-space:pre-wrap">from openai import OpenAI\n+\n+client = OpenAI(\n+    base_url=\"https://api.example.com/v1\",\n+    api_key=\"YOUR_API_KEY\"\n+)</pre><div class="dialog-actions">'+button('创建演示 Key','create-key','plus',true)+'</div>');return}if(a==='search'){modal('搜索工作空间','<label><input id="command-search" placeholder="输入页面名称，例如：模型、账本" aria-label="搜索页面" autocomplete="off"></label><div class="command-results" id="command-results"></div>');commandResults('');return}if(a==='command-nav'){document.getElementById('modal').close();location.hash=b.dataset.page;return}if(a==='task-detail'){detail('后台任务示例',[['任务状态','completed / queued'],['观察与执行','分别管理'],['取消 / 查询费用','同一生成的声明包络'],['真实操作','未连接后端']],'此页面用于预览后台任务的信息组织。');return}if(a==='project'){detail('Northstar 工作空间',[['环境','本地 HTML 预览'],['上游连接','未配置'],['数据','静态演示，刷新后重置']]);return}if(a==='profile'){detail('工作空间管理员',[['显示名称','Yulin'],['角色','演示管理员'],['真实会话','未登录']]);return}if(a==='help'){detail('关于此预览',[['视觉方向','开发者控制台 + 简洁统计'],['数据来源','静态演示'],['后端连接','无'],['页面状态','仅当前浏览器内存']],'用于确认布局、色彩、信息层级和交互。所有模型、价格、指标与凭据均为示例。')}});
document.addEventListener('click',e=>{if(e.target.classList.contains('mobile-shade'))document.getElementById('app').classList.remove('menu-open')});
function commandResults(q){const list=nav.filter(n=>n[1].toLowerCase().includes(q.toLowerCase()));document.getElementById('command-results').innerHTML=list.length?list.map(n=>'<button data-action="command-nav" data-page="'+n[0]+'">'+icon(n[2])+n[1]+'</button>').join(''):'<div class="empty">没有匹配页面。</div>'}
document.addEventListener('input',e=>{if(e.target.name==='name')e.target.setCustomValidity('');if(e.target.id==='model-search')renderModels();if(e.target.id==='request-search')filterRequests();if(e.target.id==='command-search')commandResults(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='range'){range=e.target.value;render()}if(e.target.id==='model-type')renderModels();if(e.target.id==='request-status')filterRequests()});
document.addEventListener('submit',e=>{if(e.target.id!=='key-form')return;e.preventDefault();const form=new FormData(e.target);const name=String(form.get('name')).trim();if(!name){e.target.elements.name.setCustomValidity('请输入 Key 名称');e.target.reportValidity();return}const bytes=new Uint8Array(12);crypto.getRandomValues(bytes);const secret='sk-demo-'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');keys.unshift({id:Date.now(),name,prefix:secret.slice(0,16)+'…'+secret.slice(-4),created:'2026-10-23',last:'尚未使用',status:'active',scope:String(form.get('scope'))});render();modal('演示 Key 已创建','<p>这是无效的演示凭据，仅在当前页面显示。生产环境中的密钥应只展示一次。</p><div class="secret">'+esc(secret)+'</div><div class="dialog-actions"><button class="button" data-action="copy-secret" data-secret="'+secret+'">'+icon('copy')+'复制演示 Key</button>'+button('完成','close',null,true)+'</div>')});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('[data-action="search"]').click()}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});
window.addEventListener('hashchange',render);let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(drawChart,80)});render();
</script>
