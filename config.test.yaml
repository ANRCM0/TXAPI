# 测试用配置：把渠道指向本地假上游，不需要真实 API Key
server:
  addr: "127.0.0.1:8080"
  retry_times: 2
  timeout_seconds: 30

channels:
  # 主渠道：权重高，模拟主力线路
  - id: 1
    name: "fake-primary"
    type: "openai"
    base_url: "http://127.0.0.1:9911"
    key: "sk-fake-primary-key"
    models:
      - "gpt-4o-mini"
      - "gpt-4o"
    model_mapping:
      gpt-4o: "gpt-4o-2024-08-06"
    weight: 10

  # 备用渠道：同模型，权重低
  - id: 2
    name: "fake-backup"
    type: "openai"
    base_url: "http://127.0.0.1:9911"
    key: "sk-fake-backup-key"
    models:
      - "gpt-4o-mini"
    weight: 3

tokens:
  - key: "sk-test-123"
    name: "全权限令牌"
  - key: "sk-limited-456"
    name: "受限令牌"
    models:
      - "gpt-4o-mini"
