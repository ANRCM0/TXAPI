name: Verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan reachable Go vulnerabilities
        shell: bash
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... > "$RUNNER_TEMP/govulncheck.txt"
      - name: Retain vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/govulncheck.txt
          if-no-files-found: error
          retention-days: 14

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查 go.mod / go.sum 是否整洁
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum 不整洁，请运行 go mod tidy 并提交"
            git diff go.mod go.sum
            exit 1
          fi

      - name: 内核与协议依赖边界
        run: |
          deps=$(go list -deps ./internal/core ./internal/protocol/...)
          if echo "$deps" | grep -E 'gin-gonic|gorm.io|internal/(gateway|store|billing|server)'; then
            echo "::error::core/protocol 不得依赖 HTTP 框架或业务/存储层"
            exit 1
          fi

      - name: 协作框架依赖与 API 契约
        run: |
          go test -count=1 ./internal/architecture
          go test -count=1 ./internal/server -run TestOpenAPI

      - name: 构建
        run: go build ./...

      - name: 原生控制台语法与行为
        run: make web-check

      - name: go vet
        run: go vet ./...

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: 测试（-race）
        run: go test -race -count=1 ./...

      - name: 测试覆盖率（仅报告，不设门槛）
        run: go test -cover ./... | tee coverage.txt
        continue-on-error: true

      - name: 端到端冒烟（假上游 + 临时库）
        run: make smoke

      - name: 固定官方 Python SDK 的受控兼容回归
        timeout-minutes: 6
        run: |
          python3 -m venv "$RUNNER_TEMP/txapi-sdk-venv"
          "$RUNNER_TEMP/txapi-sdk-venv/bin/python" -m pip install -r tests/smoke/requirements-sdk.txt
          "$RUNNER_TEMP/txapi-sdk-venv/bin/python" tests/smoke/sdk_conformance.py --go go
          "$RUNNER_TEMP/txapi-sdk-venv/bin/python" tests/smoke/background_sdk_conformance.py --go go
          "$RUNNER_TEMP/txapi-sdk-venv/bin/python" tests/smoke/managed_function_sdk_conformance.py --go go

      - name: 固定官方 Python WS SDK 的受控兼容回归
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/txapi-ws-sdk-venv"
          "$RUNNER_TEMP/txapi-ws-sdk-venv/bin/python" -m pip install -r tests/smoke/requirements-ws-sdk.txt
          "$RUNNER_TEMP/txapi-ws-sdk-venv/bin/python" tests/smoke/ws_sdk_conformance.py --go go

      - name: 固定 Codex CLI 的本地 Responses 兼容回归
        timeout-minutes: 5
        run: |
          codex_dir="$RUNNER_TEMP/txapi-codex-0.163.0"
          mkdir -p "$codex_dir"
          curl --fail --location --retry 2 --output "$codex_dir/codex.tar.gz" https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-x86_64-unknown-linux-musl.tar.gz
          echo "beb339e8ecd9ba057a6bb2dc81ad8ca474812edfbf0fc5056ca818797648dde4  $codex_dir/codex.tar.gz" | sha256sum --check
          tar -xzf "$codex_dir/codex.tar.gz" -C "$codex_dir"
          python3 tests/smoke/codex_conformance.py --go go --codex "$codex_dir/codex-x86_64-unknown-linux-musl"
          python3 tests/smoke/codex_ws_conformance.py --go go --codex "$codex_dir/codex-x86_64-unknown-linux-musl"
          python3 tests/smoke/codex_standard_conformance.py --go go --codex "$codex_dir/codex-x86_64-unknown-linux-musl"
          python3 tests/smoke/codex_compaction_conformance.py --go go --codex "$codex_dir/codex-x86_64-unknown-linux-musl"

      - name: 转发性能基线（仅报告）
        run: |
          set -o pipefail
          go test ./internal/core -run '^$' -bench BenchmarkExecutor -benchtime=100x -benchmem | tee benchmark.txt

      - name: 基线资源采样回归
        timeout-minutes: 1
        run: |
          python3 tests/smoke/process_resources_test.py
          python3 tests/smoke/stream_baseline_test.py

      - name: 完整网关真实 socket 流基线（正确性检查，性能仅报告）
        timeout-minutes: 4
        run: |
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('tests/smoke/stream_baseline.py').read_text(encoding='utf-8'))"
          python3 tests/smoke/stream_baseline.py --self-check --samples 20 --output "$RUNNER_TEMP/stream-baseline.json"
          python3 -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'stream-baseline.json').read_text()); print(json.dumps({k:r[k] for k in ('source','environment','configuration','resources','paired_success_count','paired_success_differences_ns','fixture_active_requests_after_measurement','drain_failures')},sort_keys=True))"

      - name: 原生 Responses 完整网关流基线（正确性检查，性能仅报告）
        timeout-minutes: 4
        run: |
          python3 tests/smoke/stream_baseline.py --operation responses --self-check --samples 20 --output "$RUNNER_TEMP/responses-stream-baseline.json"
          python3 -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'responses-stream-baseline.json').read_text()); print(json.dumps({k:r[k] for k in ('source','environment','configuration','resources','summary','planned_measurement_requests','started_measurement_requests','paired_success_count','paired_success_differences_ns','fixture_active_requests_after_measurement','drain_failures')},sort_keys=True))"

      - name: TLS 上游配对流基线（证书与正确性检查，性能仅报告）
        timeout-minutes: 4
        run: |
          for operation in chat responses; do
            python3 tests/smoke/stream_baseline.py --operation "$operation" --tls-upstream --self-check --samples 20 --output "$RUNNER_TEMP/tls-$operation-stream-baseline.json"
            python3 -c "import json,pathlib,sys; r=json.loads(pathlib.Path(sys.argv[1]).read_text()); print(json.dumps({k:r[k] for k in ('source','environment','configuration','resources','summary','planned_measurement_requests','started_measurement_requests','paired_success_count','paired_success_differences_ns','fixture_active_requests_after_measurement','drain_failures')},sort_keys=True))" "$RUNNER_TEMP/tls-$operation-stream-baseline.json"
          done

      - name: TLS 连接与 TCP 条件对照（正确性检查，性能仅报告）
        timeout-minutes: 4
        run: |
          for operation in chat responses; do
            for profile in fresh-0 persistent-1 fresh-1; do
              policy="${profile%-*}"
              nodelay="${profile##*-}"
              report="$RUNNER_TEMP/tls-$operation-$profile-stream-baseline.json"
              python3 tests/smoke/stream_baseline.py --operation "$operation" --tls-upstream --connection-policy "$policy" --fixture-tcp-nodelay "$nodelay" --self-check --samples 20 --output "$report"
              python3 -c "import json,pathlib,sys; r=json.loads(pathlib.Path(sys.argv[1]).read_text()); print(json.dumps({k:r[k] for k in ('source','environment','configuration','resources','summary','planned_measurement_requests','started_measurement_requests','paired_success_count','paired_success_differences_ns','fixture_connections_opened_during_measurement','fixture_active_requests_after_measurement','drain_failures')},sort_keys=True))" "$report"
            done
          done

      - name: 有界并发承载与过载恢复（正确性检查，性能仅报告）
        timeout-minutes: 4
        run: |
          python3 tests/smoke/capacity_baseline.py --workers 4 --requests-per-worker 5 --rounds 2 --sustain-seconds 10 --output "$RUNNER_TEMP/capacity-baseline.json"
          python3 -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'capacity-baseline.json').read_text()); print(json.dumps({k:r[k] for k in ('source','environment','configuration','summary','resources','planned_measurement_requests','started_measurement_requests','unpaired_distribution_differences_ns')},sort_keys=True)); print(json.dumps([{'held':x['observed_held_requests'],'rejected_status':x['rejected']['http_status'],'rejected_attempts':x['rejected']['upstream_attempts'],'recovery_ns':x['recovery_observed_ns'],'active_after':x['active_after_recovery']} for x in r['overload']])); print(json.dumps([{'planned':x['planned'],'canceled':x['observed_cancellations'],'active_after':x['active_after_cancel'],'cancel_spread_ns':x['cancel_request_spread_ns']} for x in r['cancellations']]))"

  console-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install isolated browser test runtime
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/txapi-browser" playwright@1.62.1
          node "$RUNNER_TEMP/txapi-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/txapi-browser/node_modules" >> "$GITHUB_ENV"
          echo "TXAPI_UI_SCREENSHOTS=$RUNNER_TEMP/txapi-console" >> "$GITHUB_ENV"
      - name: Console permission, precision, navigation and production API acceptance
        run: make browser-check
      - name: Preserve production console screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/txapi-console
          if-no-files-found: error
          retention-days: 14

  windows-resource-query:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Windows只读进程资源采样与句柄释放
        run: python tests/smoke/process_resources_test.py

  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 容器安装、升级、备份恢复与正常退出
        run: python3 tests/smoke/delivery.py --go go
      - name: 实际镜像原生 WS TLS、反代、持久续链与强杀恢复
        timeout-minutes: 6
        run: |
          codex_dir="$RUNNER_TEMP/txapi-codex-delivery-0.163.0"
          mkdir -p "$codex_dir"
          curl --fail --location --retry 2 --output "$codex_dir/codex.tar.gz" https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-x86_64-unknown-linux-musl.tar.gz
          echo "beb339e8ecd9ba057a6bb2dc81ad8ca474812edfbf0fc5056ca818797648dde4  $codex_dir/codex.tar.gz" | sha256sum --check
          tar -xzf "$codex_dir/codex.tar.gz" -C "$codex_dir"
          python3 tests/smoke/native_ws_delivery.py --go go --sdk --codex "$codex_dir/codex-x86_64-unknown-linux-musl"

  strict-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Strict ledger report assertions
        run: python3 tests/smoke/strict_native_delivery_test.py
      - name: Shipped HTTP, background and WS financial recovery
        run: python3 tests/smoke/strict_native_delivery.py --go go --output "$RUNNER_TEMP/strict-native/report.json"
      - name: Preserve strict ledger and provider transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strict-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strict-native
          if-no-files-found: error
          retention-days: 14

  p0-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 容量预算与容器采样判定回归
        run: |
          python3 tests/smoke/capacity_baseline_test.py
          python3 tests/smoke/capacity_curve_test.py
          python3 tests/smoke/docker_resources_test.py
      - name: Chat 与 Responses 分档容量、取消与全槽位恢复
        timeout-minutes: 25
        run: python3 tests/smoke/capacity_curve.py --levels 1,4,8,16 --sustain-seconds 60 --output "$RUNNER_TEMP/p0/capacity-curve.json"
      - name: 实际 Linux Docker H1 与 H2 各十五分钟持续运行
        if: ${{ !cancelled() }}
        timeout-minutes: 35
        run: python3 tests/smoke/native_ws_delivery.py --go go --soak-seconds 900 --soak-workers 2 --output "$RUNNER_TEMP/p0/docker-protocol-soak.json"
      - name: 保留全部计划、样本、失败与资源报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0
          if-no-files-found: error
          retention-days: 14
