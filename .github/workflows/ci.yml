name: Verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查 go.mod / go.sum 是否整洁
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum 不整洁，请运行 go mod tidy 并提交"
            git diff go.mod go.sum
            exit 1
          fi

      - name: 内核与协议依赖边界
        run: |
          deps=$(go list -deps ./internal/core ./internal/protocol/...)
          if echo "$deps" | grep -E 'gin-gonic|gorm.io|internal/(gateway|store|billing|server)'; then
            echo "::error::core/protocol 不得依赖 HTTP 框架或业务/存储层"
            exit 1
          fi

      - name: 协作框架依赖与 API 契约
        run: |
          go test -count=1 ./internal/architecture
          go test -count=1 ./internal/server -run TestOpenAPI

      - name: 构建
        run: go build ./...

      - name: 原生控制台语法与行为
        run: |
          node --version
          node --check web/assets/app.mjs
          node --check web/assets/api.mjs
          node --check tests/browser/navigation.cjs
          node --check tests/browser/billing.cjs
          node --check tests/browser/live.cjs
          node --test web/assets/api.test.mjs

      - name: go vet
        run: go vet ./...

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: 测试（-race）
        run: go test -race -count=1 ./...

      - name: 测试覆盖率（仅报告，不设门槛）
        run: go test -cover ./... | tee coverage.txt
        continue-on-error: true

      - name: 端到端冒烟（假上游 + 临时库）
        run: make smoke

      - name: 固定官方 Python SDK 的受控兼容回归
        timeout-minutes: 6
        run: |
          python3 -m venv "$RUNNER_TEMP/txapi-sdk-venv"
          "$RUNNER_TEMP/txapi-sdk-venv/bin/python" -m pip install -r tests/smoke/requirements-sdk.txt
          "$RUNNER_TEMP/txapi-sdk-venv/bin/python" tests/smoke/sdk_conformance.py --go go

      - name: 固定官方 Python WS SDK 的受控兼容回归
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/txapi-ws-sdk-venv"
          "$RUNNER_TEMP/txapi-ws-sdk-venv/bin/python" -m pip install -r tests/smoke/requirements-ws-sdk.txt
          "$RUNNER_TEMP/txapi-ws-sdk-venv/bin/python" tests/smoke/ws_sdk_conformance.py --go go

      - name: 转发性能基线（仅报告）
        run: |
          set -o pipefail
          go test ./internal/core -run '^$' -bench BenchmarkExecutor -benchtime=100x -benchmem | tee benchmark.txt

      - name: 基线资源采样回归
        timeout-minutes: 1
        run: python3 tests/smoke/process_resources_test.py

      - name: 完整网关真实 socket 流基线（正确性检查，性能仅报告）
        timeout-minutes: 4
        run: |
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('tests/smoke/stream_baseline.py').read_text(encoding='utf-8'))"
          python3 tests/smoke/stream_baseline.py --self-check --samples 20 --output "$RUNNER_TEMP/stream-baseline.json"
          python3 -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'stream-baseline.json').read_text()); print(json.dumps({k:r[k] for k in ('source','environment','configuration','resources','paired_success_count','paired_success_differences_ns','fixture_active_requests_after_measurement','drain_failures')},sort_keys=True))"

      - name: 有界并发承载与过载恢复（正确性检查，性能仅报告）
        timeout-minutes: 4
        run: |
          python3 tests/smoke/capacity_baseline.py --workers 4 --requests-per-worker 5 --rounds 2 --output "$RUNNER_TEMP/capacity-baseline.json"
          python3 -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'capacity-baseline.json').read_text()); print(json.dumps({k:r[k] for k in ('source','environment','configuration','summary','resources','planned_measurement_requests','started_measurement_requests','unpaired_distribution_differences_ns')},sort_keys=True)); print(json.dumps([{'held':x['observed_held_requests'],'rejected_status':x['rejected']['http_status'],'rejected_attempts':x['rejected']['upstream_attempts'],'recovery_ns':x['recovery_observed_ns'],'active_after':x['active_after_recovery']} for x in r['overload']])); print(json.dumps([{'planned':x['planned'],'canceled':x['observed_cancellations'],'active_after':x['active_after_cancel'],'cancel_spread_ns':x['cancel_request_spread_ns']} for x in r['cancellations']]))"

  windows-resource-query:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Windows只读进程资源采样与句柄释放
        run: python tests/smoke/process_resources_test.py

  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 容器安装、升级、备份恢复与正常退出
        run: python3 tests/smoke/delivery.py --go go
