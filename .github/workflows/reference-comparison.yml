name: Reference Comparison

on:
  pull_request:
    paths:
      - "tests/smoke/reference_*.py"
      - "tests/smoke/stream_baseline.py"
      - "tests/smoke/process_resources.py"
      - "tests/smoke/local.py"
      - "tests/smoke/sdk_conformance.py"
      - ".github/workflows/reference-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-chat-http:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: QuantumNous/new-api
          ref: 25372e30b1f94255b1f818aeaaf006f042572580
          path: .local/reference-source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .local/reference-source/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .local/reference-source/go.sum
      - name: Build fixed reference without install hooks
        timeout-minutes: 45
        run: |
          python3 tests/smoke/reference_build.py --source .local/reference-source --work "$RUNNER_TEMP/new-api-reference" --go go
      - name: Compare controlled common Chat SSE path
        timeout-minutes: 6
        run: |
          python3 tests/smoke/reference_comparison.py --reference "$RUNNER_TEMP/new-api-reference" --samples 20 --rounds 2 --output "$RUNNER_TEMP/reference-comparison.json"
      - name: Compare controlled common Chat JSON path
        timeout-minutes: 6
        run: |
          python3 tests/smoke/reference_comparison.py --reference "$RUNNER_TEMP/new-api-reference" --operation chat-json --samples 20 --rounds 2 --output "$RUNNER_TEMP/reference-json-comparison.json"
      - name: Report exact source, configuration, failures and resources
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          reports = [pathlib.Path(os.environ["RUNNER_TEMP"]) / name for name in ("reference-comparison.json", "reference-json-comparison.json")]
          for report_path in reports:
              if report_path.exists():
                  report = json.loads(report_path.read_text())
                  print(json.dumps({key: report.get(key) for key in ("source", "reference_build", "environment", "configuration", "stage", "summary", "resources", "planned_measurement_requests", "started_measurement_requests", "paired_differences_ns", "active_upstream_after_measurement", "auth_checks", "client_self_checks", "reference_persisted_consumption", "txapi_persisted_requests", "fatal_error")}, sort_keys=True))
              else:
                  print("Missing comparison report: " + report_path.name)
          if not any(path.exists() for path in reports):
              build_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "new-api-reference" / "build.json"
              print(build_path.read_text() if build_path.exists() else "Reference build did not produce a record")
          PY
