# 极简网关配置文件
#
# P2 起这份配置只负责两件事：
#   1. server 段：网关自身运行参数（监听地址/重试/超时）
#   2. database 段：SQLite 文件位置
#
# 渠道和令牌**不再写在这里**——它们存在数据库里，通过管理 API 增删改：
#   curl http://127.0.0.1:8080/api/channels
# 改完立即生效，不需要重启网关。
#
# 下面的 channels / tokens 段是「种子数据」：只在数据库为空时导入一次，
# 导入过之后再改这里不会生效（避免覆盖你在界面上做的调整）。
# 数据库已有渠道时，这两段可以整段删掉。

server:
  addr: "127.0.0.1:8080"
  # 首次失败后最多再换渠道重试几次
  retry_times: 2
  # 单次上游请求超时（秒），流式响应会长时间挂连接，不要设太小
  timeout_seconds: 120

database:
  # 目前只支持 sqlite；PostgreSQL 留到后续阶段
  driver: "sqlite"
  # 相对路径按进程工作目录解析。想换位置就改这里，不用动代码。
  path: "data/gateway.db"

# ---- 以下为种子数据：仅在数据库为空时导入一次 ----
# 渠道 = 上游服务商配置。导入后 key 会成为该渠道下的第一个「凭据」。
# 这里的 key 是「网关访问上游」用的，不是给客户端用的。
channels:
  # 渠道 1：假装是 OpenAI 官方
  # 注意：这个 key 是假的，真实使用时换成你的 key
  - id: 1
    name: "openai-primary"
    type: "openai"
    base_url: "https://api.openai.com"
    key: "sk-REPLACE-WITH-YOUR-REAL-OPENAI-KEY"
    models:
      - "gpt-4o-mini"
      - "gpt-4o"
    # 把客户端请求的 gpt-4o 锁定到具体版本，客户端无感知
    model_mapping:
      gpt-4o: "gpt-4o-2024-08-06"
    weight: 10

  # 渠道 2：同一个模型的备用渠道（模拟第三方中转）
  # 演示负载均衡：两个渠道都支持 gpt-4o-mini，按权重分流
  - id: 2
    name: "openai-backup"
    type: "openai"
    base_url: "https://api.deepseek.com"
    key: "sk-REPLACE-WITH-YOUR-DEEPSEEK-KEY"
    models:
      - "deepseek-chat"
    weight: 5

# 令牌 = 客户端访问网关用的凭证
tokens:
  - key: "sk-test-123"
    name: "本地测试令牌"
    # models 为空表示不限制模型访问
  - key: "sk-limited-456"
    name: "受限令牌（只能访问 gpt-4o-mini）"
    models:
      - "gpt-4o-mini"
